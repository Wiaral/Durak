        function saveAdminEconomyConfig() {
            const refillVal = parseInt(document.getElementById('adm-refill-input').value, 10);
            const rakeVal = parseInt(document.getElementById('adm-rake-input').value, 10);
            const botUserEl = document.getElementById('adm-bot-username');
            if (botUserEl && botUserEl.value.trim()) {
                ADMIN_CONFIG.botUsername = botUserEl.value.trim().replace(/^@/, '');
            }
            if (!isNaN(refillVal) && refillVal >= 100) ADMIN_CONFIG.dailyRefillLimit = refillVal;
            if (!isNaN(rakeVal) && rakeVal >= 0 && rakeVal <= 30) ADMIN_CONFIG.rakePercent = rakeVal;
            saveProfile();
            renderAdminModal();
            showToast(`✅ Сохранено! Бот: @${ADMIN_CONFIG.botUsername}, долив до ${ADMIN_CONFIG.dailyRefillLimit} 🪙`);
        }

<!-- ... existing code ... -->
        // Тактильная отдача Telegram (Haptic Feedback)
        function triggerHaptic(style = 'light') {
            try {
                const hf = window.Telegram?.WebApp?.HapticFeedback;
                if (!hf) return;
                if (style === 'success' || style === 'warning' || style === 'error') {
                    hf.notificationOccurred(style);
                } else {
                    hf.impactOccurred(style);
                }
            } catch (e) {}
        }

        // Инициализация Telegram Mini App (профиль, полный экран, deep-link комнаты)
        function initTelegramMiniApp() {
            ADMIN_CONFIG.botUsername = ADMIN_CONFIG.botUsername || 'durak_online_bot';
            try {
                const tg = window.Telegram?.WebApp;
                if (!tg) return;

                tg.ready();
                tg.expand();
                if (typeof tg.disableVerticalSwipes === 'function') {
                    tg.disableVerticalSwipes();
                }
                if (typeof tg.setHeaderColor === 'function') {
                    tg.setHeaderColor('#0f172a');
                }
                if (typeof tg.setBackgroundColor === 'function') {
                    tg.setBackgroundColor('#090d16');
                }

                // Подтягиваем реальное имя и аватарку пользователя из Telegram
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    const displayName = [user.first_name, user.last_name].filter(Boolean).join(' ') || user.username || `Игрок #${user.id}`;
                    const nameEl = document.getElementById('header-user-name');
                    if (nameEl) nameEl.textContent = displayName;

                    const selfInDb = MOCK_USERS_DB.find(u => u.isSelf);
                    if (selfInDb) selfInDb.name = displayName;

                    if (user.photo_url) {
                        const imgEl = document.getElementById('header-user-photo');
                        const emojiEl = document.getElementById('header-user-avatar');
                        if (imgEl && emojiEl) {
                            imgEl.src = user.photo_url;
                            imgEl.classList.remove('hidden');
                            emojiEl.classList.add('hidden');
                        }
                    }
                }

                // Проверяем параметр приглашения в комнату (?startapp=room_1234_7744)
                const startParam = tg.initDataUnsafe?.start_param;
                if (startParam && startParam.startsWith('room_')) {
                    const parts = startParam.split('_');
                    const roomId = parseInt(parts[1], 10);
                    if (!isNaN(roomId)) {
                        setTimeout(() => {
                            showToast(`🔗 Переход по приглашению в комнату #${roomId}...`);
                            const existing = ALL_SESSIONS.find(s => s.id === roomId);
                            if (existing) {
                                startNewGame(existing);
                            } else {
                                startNewGame({
                                    id: roomId,
                                    title: `Стол друга #${roomId}`,
                                    host: 'Друг_из_Telegram',
                                    avatar: '🦊',
                                    rank: 'Золото',
                                    bet: 250,
                                    deckSize: 36,
                                    mode: 'podkidnoy',
                                    cheating: false,
                                    allowDraw: false,
                                    throwRule: 'neighbors'
                                });
                            }
                        }, 400);
                    }
                }
            } catch (e) {}
        }

        window.onload = function() {
            initTelegramMiniApp();

            renderPublicSessions();
